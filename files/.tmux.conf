# Enable RGB/True Color support
#set-option -r mouse on
#set-option -g default-terminal "screen-256color"
#set-aserial -a terminal-features ",*256col*:RGB"

# Allow OSC 52 clipboard sequences to pass through tmux
set -s set-clipboard on
set -g mouse on
set -g default-terminal "tmux-256color"       # needs tmux-256color terminfo on the remote; else use screen-256color
set -as terminal-features ",*:RGB:clipboard"   # forces truecolor + OSC 52 regardless of the remote's terminfo
set -s set-clipboard on
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Put the status bar at the top (makes it look more like Ghostty tabs)
set-option -g status-position top

# Title Bar
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}./#{b:pane_current_path} \"#{=40:pane_title}\" %H:%M %d-%b-%y"
set -g status-right-length 80

# Notifications
set -g allow-passthrough all
